name: Update Stock Data

on:
  workflow_dispatch: # ทำให้เรากดปุ่มรันเองได้จากหน้าเว็บ GitHub
  schedule:
    - cron: '0 0 * * *' # ตั้งเวลารันทุกวัน (เวลา UTC)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Run script to fetch data
        run: python fetch_yahoo.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stocks_data.json
          git commit -m "Auto-update stock data [skip ci]" || exit 0
          git push

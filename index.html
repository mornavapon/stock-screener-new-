<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Watchlist Tablet Screener</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; }
        body { font-family: 'Sarabun', sans-serif; }

        /* กรอบแอปตรึงเต็มพื้นที่ "มองเห็นจริง" ของหน้าจอ
           (แก้ปัญหา 100vh บน Chrome มือถือ/แท็บเล็ต ที่สูงเกินจอ ทำให้ปุ่มมุมล่างซ้ายหาย) */
        #app { position: fixed; inset: 0; display: flex; overflow: hidden; }

        /* ตารางอยู่ใน scroll container ตัวเดียว (ไม่มี padding ด้านบน)
           หัวตารางจึงตรึงชิดขอบบนพอดี ไม่มีแถวหุ้นโผล่ลอดช่องว่างด้านบน */
        #table-scroll { overflow: auto; -webkit-overflow-scrolling: touch; }
        #stock-table { border-collapse: separate; border-spacing: 0; min-width: 900px; width: 100%; }
        #stock-table thead th {
            position: sticky; top: 0; z-index: 20;
            background: #0f172a;               /* slate-900 ทึบ ไม่โปร่งใส */
            border-bottom: 1px solid #334155;  /* เส้นใต้หัวตาราง */
        }
        #stock-table tbody td { border-bottom: 1px solid #1e293b; }

        /* ที่จับสำหรับลากเรียงลำดับ Watchlist (ปิดการเลื่อนหน้าจอเฉพาะตรงที่จับ เพื่อให้ลากด้วยนิ้วได้) */
        .wl-handle { touch-action: none; -webkit-user-select: none; user-select: none; }
        .wl-dragging { box-shadow: 0 0 0 2px #34d399, 0 8px 20px rgba(0,0,0,.5); opacity: .9; position: relative; z-index: 10; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100">

<div id="app">

    <!-- Sidebar -->
    <aside class="w-72 h-full min-h-0 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0">
        <div class="p-4 border-b border-slate-800 shrink-0">
            <h1 class="text-xl font-bold text-emerald-400 mb-1">Tablet Screener</h1>
            <p class="text-xs text-slate-400" id="last-update">กำลังโหลดข้อมูล...</p>
        </div>

        <!-- แถบหัวรายการ Watchlist + ปุ่มเรียง A→Z -->
        <div class="shrink-0 px-4 pt-3 pb-1 flex items-center justify-between gap-2 text-xs text-slate-400">
            <span>ลากที่ ☰ เพื่อเรียงลำดับ</span>
            <button onclick="sortWatchlistsAZ()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-2 py-1 rounded border border-slate-700 transition cursor-pointer">เรียง A→Z</button>
        </div>

        <!-- รายการ Watchlists (เลื่อนได้เมื่อมีเยอะ) -->
        <div class="flex-1 min-h-0 overflow-y-auto px-3 py-2 space-y-1" id="watchlist-nav"></div>

        <!-- สร้าง Watchlist ใหม่ + Export/Import (ตรึงอยู่ล่างสุดของ Sidebar เสมอ) -->
        <div class="shrink-0 p-4 border-t border-slate-800 space-y-2 bg-slate-900">
            <div class="flex gap-2">
                <input type="text" id="new-wl-name" placeholder="ชื่อ Watchlist ใหม่..."
                       onkeydown="if(event.key==='Enter') createWatchlist()"
                       class="flex-1 min-w-0 bg-slate-800 text-sm px-3 py-2 rounded border border-slate-700 focus:outline-none focus:border-emerald-500">
                <button onclick="createWatchlist()" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-2 rounded text-sm transition cursor-pointer text-white font-bold">+</button>
            </div>
            <div class="flex gap-2 pt-1">
                <button onclick="exportWatchlists()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-xs py-2 rounded border border-slate-700 transition cursor-pointer text-center">Export JSON</button>
                <label class="flex-1 bg-slate-800 hover:bg-slate-700 text-xs py-2 rounded border border-slate-700 text-center transition cursor-pointer text-slate-200">
                    Import JSON <input type="file" id="import-file" class="hidden" accept=".json,application/json" onchange="importWatchlists(event)">
                </label>
            </div>
        </div>
    </aside>

    <!-- พื้นที่หลัก -->
    <main class="flex-1 min-w-0 h-full flex flex-col">

        <header class="bg-slate-900 border-b border-slate-800 px-4 py-2 flex flex-wrap justify-between items-center gap-x-4 gap-y-2 shrink-0">
            <div class="flex items-center gap-3 min-w-0">
                <h2 id="current-wl-title" class="text-xl font-semibold text-emerald-400 truncate">เลือก Watchlist</h2>
                <button onclick="renameCurrentWatchlist()" class="shrink-0 text-xs text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded border border-slate-700 transition">เปลี่ยนชื่อ</button>
                <button onclick="deleteWatchlist(currentWL)" class="shrink-0 text-xs text-rose-400 hover:text-rose-300 bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded border border-slate-700 transition">ลบ</button>
            </div>

            <div class="relative w-full max-w-xs sm:w-80">
                <input type="text" id="search-stock-input" placeholder="พิมพ์ชื่อหรือรหัสหุ้นเพื่อเพิ่ม..." oninput="searchUniverse()"
                       class="w-full bg-slate-800 text-sm px-3 py-1.5 rounded border border-slate-700 focus:outline-none focus:border-emerald-500">
                <div id="search-results-dropdown" class="absolute left-0 right-0 mt-1 bg-slate-800 border border-slate-700 rounded shadow-lg max-h-60 overflow-y-auto z-50 hidden"></div>
            </div>
        </header>

        <!-- ตาราง: scroll container ตัวเดียว หัวตารางตรึงบนสุด -->
        <div id="table-scroll" class="flex-1 min-h-0">
            <table id="stock-table" class="text-left">
                <thead class="text-slate-200 text-xs">
                    <tr id="table-head-row"></tr>
                </thead>
                <tbody id="stock-table-body" class="text-sm"></tbody>
            </table>
        </div>
    </main>

</div>

<!-- หน้าต่างเลือกเมื่อแตะชื่อหุ้น: งบ (Yahoo) / กราฟ (TradingView) / ถาม Claude -->
<div id="stock-menu" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/70 p-4"
     onclick="if (event.target === this) closeStockMenu()">
    <div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-xl shadow-2xl p-5">
        <div class="flex items-start justify-between gap-3 mb-4">
            <div class="min-w-0">
                <div id="stock-menu-ticker" class="text-2xl font-bold text-emerald-400"></div>
                <div id="stock-menu-name" class="text-sm text-slate-400 truncate"></div>
            </div>
            <button onclick="closeStockMenu()" class="shrink-0 text-slate-400 hover:text-white text-2xl leading-none px-2 py-1 cursor-pointer" title="ปิด">✕</button>
        </div>
        <div class="space-y-3">
            <a id="link-yahoo" target="_blank" rel="noopener noreferrer"
               class="block bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg px-4 py-3.5 text-base font-medium text-slate-100 text-center">📊 ดูงบจาก Yahoo Finance</a>
            <a id="link-tv" target="_blank" rel="noopener noreferrer"
               class="block bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg px-4 py-3.5 text-base font-medium text-slate-100 text-center">📈 ดูกราฟจาก TradingView</a>
            <a id="link-claude" target="_blank" rel="noopener noreferrer"
               class="block bg-emerald-700 hover:bg-emerald-600 border border-emerald-500 rounded-lg px-4 py-3.5 text-base font-medium text-white text-center">🤖 ถามข้อมูลหุ้นนี้กับ Claude</a>
        </div>
    </div>
</div>

<script>
    // ---------- คอลัมน์ (เรียงตามที่ต้องการ) ----------
    // best = ทิศทางเรียงครั้งแรกที่กด ('desc' = มากไปน้อย, 'asc' = น้อยไปมาก)
    const COLUMNS = [
        { key: 'ticker',        label: 'TICKER / NAME',  align: 'left',  best: 'asc'  },
        { key: 'price',         label: 'PRICE',          align: 'right', best: 'desc' },
        { key: 'marketCap',     label: 'MARKET CAP',     align: 'right', best: 'desc' },
        { key: 'pe',            label: 'P/E',            align: 'right', best: 'asc'  },
        { key: 'pb',            label: 'P/BV',           align: 'right', best: 'asc'  },
        { key: 'dividendYield', label: 'DIV YIELD (%)',  align: 'right', best: 'desc' },
        { key: 'roe',           label: 'ROE (%)',        align: 'right', best: 'desc' },
        { key: 'de',            label: 'D/E',            align: 'right', best: 'asc'  },
        { key: 'gpm',           label: 'GPM (%)',        align: 'right', best: 'desc' },
        { key: 'npm',           label: 'NPM (%)',        align: 'right', best: 'desc' },
    ];

    let globalData = { updated_at: "", stocks: [] };

    // ---------- Watchlists (เก็บในเครื่อง สร้างได้ไม่จำกัด) ----------
    function loadWatchlists() {
        try {
            const w = JSON.parse(localStorage.getItem('tablet_watchlists'));
            if (w && typeof w === 'object' && !Array.isArray(w) && Object.keys(w).length > 0) {
                Object.keys(w).forEach(k => { if (!Array.isArray(w[k])) w[k] = []; });
                return w;
            }
        } catch (e) {}
        return { "Watchlist 1": [] };
    }
    let watchlists = loadWatchlists();
    let currentWL = Object.keys(watchlists)[0];
    let currentSort = { key: null, order: 'asc' };

    function esc(str) {
        return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function saveWatchlists() {
        localStorage.setItem('tablet_watchlists', JSON.stringify(watchlists));
    }

    function refreshAll() {
        renderWatchlistNav();
        renderTable();
    }

    // ---------- โหลดข้อมูลหุ้น ----------
    async function loadData() {
        try {
            const res = await fetch('stocks_data.json?t=' + Date.now());
            globalData = await res.json();
            document.getElementById('last-update').innerText = `อัปเดตล่าสุด: ${globalData.updated_at}`;
        } catch (err) {
            console.error("ไม่สามารถโหลดข้อมูลหุ้นได้:", err);
            document.getElementById('last-update').innerText = "โหลดข้อมูลไม่สำเร็จ";
        }
        refreshAll();
    }

    // ---------- หัวตาราง: กดที่ชื่อหัวข้อเพื่อ sort ได้เลย ----------
    function renderHead() {
        const row = document.getElementById('table-head-row');
        const ths = COLUMNS.map(c => {
            const active = currentSort.key === c.key;
            const arrow = active ? (currentSort.order === 'asc' ? '▲' : '▼') : '';
            const color = active ? 'text-emerald-400' : 'text-slate-200 hover:text-emerald-300';
            return `
                <th class="px-3 py-2 text-${c.align} cursor-pointer select-none transition ${color}"
                    onclick="sortBy('${c.key}')" title="กดเพื่อเรียงตาม ${c.label}">
                    <span class="whitespace-nowrap">${c.label}<span class="inline-block w-3 ml-1 text-[10px] text-emerald-400">${arrow}</span></span>
                </th>`;
        }).join('');
        row.innerHTML = ths + `<th class="px-3 py-2 text-center text-slate-200">จัดการ</th>`;
    }

    // กดครั้งแรก = ทิศทางที่มักใช้ (เช่น P/E น้อยไปมาก) กดซ้ำ = สลับทิศทาง
    function sortBy(key) {
        const col = COLUMNS.find(c => c.key === key);
        if (currentSort.key === key) {
            currentSort.order = currentSort.order === 'asc' ? 'desc' : 'asc';
        } else {
            currentSort = { key, order: col ? col.best : 'desc' };
        }
        renderTable();
    }

    // ---------- Sidebar: รายการ Watchlist (ลบได้ + ลากเรียงลำดับได้) ----------
    function renderWatchlistNav() {
        if (!watchlists[currentWL]) currentWL = Object.keys(watchlists)[0];
        const nav = document.getElementById('watchlist-nav');
        nav.innerHTML = '';
        Object.keys(watchlists).forEach(name => {
            const active = name === currentWL;
            const row = document.createElement('div');
            row.dataset.name = name;
            row.className = `flex items-center rounded transition ${active ? 'bg-emerald-600 text-white font-bold' : 'text-slate-300 hover:bg-slate-800'}`;
            row.innerHTML = `
                <span class="wl-handle px-2.5 py-3 cursor-grab text-base leading-none opacity-70" title="ลากเพื่อเรียงลำดับ">☰</span>
                <button class="wl-name flex-1 min-w-0 text-left py-2.5 text-sm font-medium cursor-pointer flex justify-between items-center gap-2">
                    <span class="truncate">${esc(name)}</span>
                    <span class="text-xs opacity-75 shrink-0">(${(watchlists[name] || []).length})</span>
                </button>
                <button class="wl-del px-3 py-2.5 text-base leading-none opacity-60 hover:opacity-100 cursor-pointer" title="ลบ Watchlist นี้">✕</button>`;
            row.querySelector('.wl-name').onclick = () => { currentWL = name; refreshAll(); };
            row.querySelector('.wl-del').onclick = (e) => { e.stopPropagation(); deleteWatchlist(name); };
            attachDrag(row.querySelector('.wl-handle'), row);
            nav.appendChild(row);
        });
        document.getElementById('current-wl-title').innerText = currentWL;
    }

    // ลากเพื่อเรียงลำดับ (ใช้ได้ทั้งนิ้วบนแท็บเล็ตและเมาส์)
    function attachDrag(handle, row) {
        handle.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            const nav = document.getElementById('watchlist-nav');
            handle.setPointerCapture(e.pointerId);
            row.classList.add('wl-dragging');

            // ระหว่างลาก "ไม่ย้ายแถวใน DOM" (ไม่งั้นเบราว์เซอร์จะปล่อยการจับนิ้ว)
            // แต่ให้แถวเลื่อนตามนิ้ว + มีเส้นเขียวบอกตำแหน่งที่จะวาง แล้วค่อยสลับลำดับตอนปล่อยนิ้ว
            const startY = e.clientY;
            const startScroll = nav.scrollTop;
            let dropIndex = 0;
            const others = () => [...nav.children].filter(c => c !== row);

            const onMove = (ev) => {
                const y = ev.clientY;
                const nr = nav.getBoundingClientRect();
                if (y < nr.top + 36) nav.scrollTop -= 14;           // ใกล้ขอบบน → เลื่อนขึ้น
                else if (y > nr.bottom - 36) nav.scrollTop += 14;   // ใกล้ขอบล่าง → เลื่อนลง

                row.style.transform = `translateY(${y - startY + (nav.scrollTop - startScroll)}px)`;

                const list = others();
                dropIndex = list.filter(s => {
                    const r = s.getBoundingClientRect();
                    return y > r.top + r.height / 2;
                }).length;
                list.forEach(s => { s.style.boxShadow = ''; });
                if (list.length) {
                    if (dropIndex < list.length) list[dropIndex].style.boxShadow = 'inset 0 3px 0 #34d399';
                    else list[list.length - 1].style.boxShadow = 'inset 0 -3px 0 #34d399';
                }
            };

            const onEnd = () => {
                handle.removeEventListener('pointermove', onMove);
                handle.removeEventListener('pointerup', onEnd);
                handle.removeEventListener('pointercancel', onEnd);
                const order = others().map(c => c.dataset.name);
                order.splice(dropIndex, 0, row.dataset.name);
                const reordered = {};
                order.forEach(n => { reordered[n] = watchlists[n]; });
                watchlists = reordered;
                saveWatchlists();
                renderWatchlistNav();
            };

            handle.addEventListener('pointermove', onMove);
            handle.addEventListener('pointerup', onEnd);
            handle.addEventListener('pointercancel', onEnd);
        });
    }

    function sortWatchlistsAZ() {
        const names = Object.keys(watchlists).sort((a, b) => a.localeCompare(b, 'th', { numeric: true, sensitivity: 'base' }));
        const sorted = {};
        names.forEach(n => { sorted[n] = watchlists[n]; });
        watchlists = sorted;
        saveWatchlists();
        renderWatchlistNav();
    }

    function createWatchlist() {
        const input = document.getElementById('new-wl-name');
        const name = input.value.trim();
        if (!name) return;
        if (watchlists[name]) { alert("มีชื่อ Watchlist นี้อยู่แล้ว"); return; }
        watchlists[name] = [];
        currentWL = name;
        input.value = '';
        saveWatchlists();
        refreshAll();
    }

    function renameCurrentWatchlist() {
        const newName = prompt("เปลี่ยนชื่อ Watchlist เป็น:", currentWL);
        if (!newName || !newName.trim()) return;
        const trimmed = newName.trim();
        if (trimmed === currentWL) return;
        if (watchlists[trimmed]) { alert("มีชื่อ Watchlist นี้อยู่แล้ว"); return; }
        // คงลำดับของ Watchlist เดิมไว้
        const renamed = {};
        Object.keys(watchlists).forEach(k => { renamed[k === currentWL ? trimmed : k] = watchlists[k]; });
        watchlists = renamed;
        currentWL = trimmed;
        saveWatchlists();
        refreshAll();
    }

    // ลบ Watchlist ใดก็ได้ (ถ้าลบจนหมด จะสร้าง Watchlist ว่างให้ 1 อัน)
    function deleteWatchlist(name) {
        if (!watchlists[name]) return;
        const count = watchlists[name].length;
        if (!confirm(`ต้องการลบ "${name}" ใช่หรือไม่?${count ? `\n(มีหุ้นอยู่ ${count} ตัว)` : ''}`)) return;
        delete watchlists[name];
        if (Object.keys(watchlists).length === 0) watchlists = { "Watchlist 1": [] };
        if (!watchlists[currentWL]) currentWL = Object.keys(watchlists)[0];
        saveWatchlists();
        refreshAll();
    }

    // ---------- ค้นหา/เพิ่ม/ลบหุ้น ----------
    function searchUniverse() {
        const keyword = document.getElementById('search-stock-input').value.trim().toLowerCase();
        const dropdown = document.getElementById('search-results-dropdown');
        if (!keyword) { dropdown.classList.add('hidden'); return; }

        const matched = globalData.stocks
            .filter(s => s.ticker.toLowerCase().includes(keyword) || (s.name || '').toLowerCase().includes(keyword))
            .slice(0, 30);
        if (matched.length === 0) { dropdown.classList.add('hidden'); return; }

        dropdown.innerHTML = matched.map(s => `
            <div onclick="addStockToCurrentWL('${esc(s.ticker)}')" class="p-2 hover:bg-slate-700 cursor-pointer text-xs flex justify-between gap-2 border-b border-slate-700">
                <span class="font-bold text-emerald-400">${esc(s.ticker)}</span>
                <span class="text-slate-300 truncate max-w-[180px]">${esc(s.name)}</span>
            </div>
        `).join('');
        dropdown.classList.remove('hidden');
    }

    function addStockToCurrentWL(ticker) {
        if (!watchlists[currentWL]) watchlists[currentWL] = [];
        if (!watchlists[currentWL].includes(ticker)) {
            watchlists[currentWL].push(ticker);
            saveWatchlists();
            refreshAll();
        }
        document.getElementById('search-stock-input').value = '';
        document.getElementById('search-results-dropdown').classList.add('hidden');
    }

    function removeStock(ticker) {
        if (!confirm(`ต้องการลบ ${ticker} ออกจาก "${currentWL}" ใช่หรือไม่?`)) return;
        watchlists[currentWL] = (watchlists[currentWL] || []).filter(t => t !== ticker);
        saveWatchlists();
        refreshAll();
    }

    // ---------- หน้าต่างเมนูของหุ้นแต่ละตัว ----------
    // รหัสสำหรับ TradingView (ต้องระบุตลาดสำหรับหุ้นนอกสหรัฐ)
    function tradingViewSymbol(t) {
        const u = t.toUpperCase();
        if (u.endsWith('.BK')) return 'SET:' + u.slice(0, -3);
        if (u.endsWith('.HK')) return 'HKEX:' + String(parseInt(u.slice(0, -3), 10));
        if (u.endsWith('.SZ')) return 'SZSE:' + u.slice(0, -3);
        if (u.endsWith('.SS')) return 'SSE:' + u.slice(0, -3);
        if (u.endsWith('.PA')) return 'EURONEXT:' + u.slice(0, -3);
        return u.replace('-', '.');          // เช่น BRK-B → BRK.B
    }

    // ข้อความที่ส่งไปถาม Claude (แนบตัวเลขที่เห็นในแอปให้ด้วย)
    function claudePrompt(s) {
        const f = (v, suf = '') => (v ? v.toFixed(2) + suf : 'ไม่มีข้อมูล');
        return `ช่วยวิเคราะห์หุ้น ${s.ticker} (${s.name}) ให้หน่อย โดยค้นข้อมูลล่าสุดจากอินเทอร์เน็ตประกอบด้วย\n\n` +
            `ตัวเลขปัจจุบันจากแอปของฉัน: ราคา ${s.price || 'ไม่มีข้อมูล'} ${s.currency || ''}, P/E ${f(s.pe)}, P/BV ${f(s.pb)}, ` +
            `ROE ${f(s.roe, '%')}, D/E ${f(s.de)}, อัตรากำไรขั้นต้น ${f(s.gpm, '%')}, อัตรากำไรสุทธิ ${f(s.npm, '%')}, ` +
            `อัตราเงินปันผล ${f(s.dividendYield, '%')}\n\n` +
            `อยากรู้: 1) ธุรกิจหลักและรายได้มาจากไหน 2) จุดแข็งและความเสี่ยง 3) งบและแนวโน้มล่าสุด ` +
            `4) ตอนนี้มูลค่าแพงหรือถูกเมื่อเทียบกับคู่แข่ง\nตอบเป็นภาษาไทย กระชับ อ่านง่าย`;
    }

    function openStockMenu(ticker) {
        const s = globalData.stocks.find(x => x.ticker === ticker);
        if (!s) return;
        document.getElementById('stock-menu-ticker').innerText = s.ticker;
        document.getElementById('stock-menu-name').innerText = s.name || '';
        document.getElementById('link-yahoo').href =
            `https://finance.yahoo.com/quote/${encodeURIComponent(s.ticker)}/key-statistics/`;
        document.getElementById('link-tv').href =
            `https://www.tradingview.com/chart/?symbol=${encodeURIComponent(tradingViewSymbol(s.ticker))}`;
        document.getElementById('link-claude').href =
            `https://claude.ai/new?q=${encodeURIComponent(claudePrompt(s))}`;
        const m = document.getElementById('stock-menu');
        m.classList.remove('hidden');
        m.classList.add('flex');
    }

    function closeStockMenu() {
        const m = document.getElementById('stock-menu');
        m.classList.add('hidden');
        m.classList.remove('flex');
    }
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeStockMenu(); });

    // ---------- แสดงผลตาราง ----------
    function formatMarketCap(v) {
        if (!v) return '-';
        if (v >= 1e12) return (v / 1e12).toFixed(2) + 'T';
        if (v >= 1e9)  return (v / 1e9).toFixed(2) + 'B';
        if (v >= 1e6)  return (v / 1e6).toFixed(2) + 'M';
        return v.toLocaleString();
    }
    const num  = v => (v ? v.toFixed(2) : '-');
    const pct  = v => (v ? v.toFixed(2) + '%' : '-');

    function renderTable() {
        renderHead();
        const tbody = document.getElementById('stock-table-body');
        const tickers = watchlists[currentWL] || [];
        let rows = globalData.stocks.filter(s => tickers.includes(s.ticker));

        if (currentSort.key) {
            const { key, order } = currentSort;
            const dir = order === 'asc' ? 1 : -1;
            rows.sort((a, b) => {
                if (key === 'ticker') return dir * a.ticker.localeCompare(b.ticker);
                const va = a[key], vb = b[key];
                const missA = !va, missB = !vb;           // ค่า 0/ไม่มีข้อมูล ให้ไปอยู่ท้ายเสมอ
                if (missA && missB) return 0;
                if (missA) return 1;
                if (missB) return -1;
                return dir * (va - vb);
            });
        }

        if (rows.length === 0) {
            tbody.innerHTML = `<tr><td colspan="${COLUMNS.length + 1}" class="p-8 text-center text-slate-500">ยังไม่มีหุ้นใน Watchlist นี้ (ใช้ช่องค้นหาด้านบนเพื่อเพิ่มหุ้น)</td></tr>`;
            return;
        }

        tbody.innerHTML = rows.map(s => `
            <tr class="hover:bg-slate-800/50 transition">
                <td class="px-3 py-1.5 cursor-pointer" onclick="openStockMenu('${esc(s.ticker)}')" title="แตะเพื่อดูงบ / กราฟ / ถาม Claude">
                    <div class="font-bold text-emerald-400 leading-tight">${esc(s.ticker)}</div>
                    <div class="text-xs text-slate-400 truncate max-w-[180px] leading-tight">${esc(s.name)}</div>
                </td>
                <td class="px-3 py-1.5 text-right font-mono">${s.price ? s.price.toLocaleString() : '-'}</td>
                <td class="px-3 py-1.5 text-right font-mono">${formatMarketCap(s.marketCap)}</td>
                <td class="px-3 py-1.5 text-right font-mono">${num(s.pe)}</td>
                <td class="px-3 py-1.5 text-right font-mono">${num(s.pb)}</td>
                <td class="px-3 py-1.5 text-right font-mono">${pct(s.dividendYield)}</td>
                <td class="px-3 py-1.5 text-right font-mono">${pct(s.roe)}</td>
                <td class="px-3 py-1.5 text-right font-mono">${num(s.de)}</td>
                <td class="px-3 py-1.5 text-right font-mono">${pct(s.gpm)}</td>
                <td class="px-3 py-1.5 text-right font-mono">${pct(s.npm)}</td>
                <td class="px-3 py-1.5 text-center">
                    <button onclick="removeStock('${esc(s.ticker)}')" class="text-rose-400 hover:text-rose-300 text-xs bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded border border-slate-700 transition cursor-pointer">ลบ</button>
                </td>
            </tr>
        `).join('');
    }

    // ---------- Export / Import ----------
    function exportWatchlists() {
        const blob = new Blob([JSON.stringify(watchlists, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'my_tablet_watchlists.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function importWatchlists(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (e) {
            try {
                const imported = JSON.parse(e.target.result);
                const valid = imported && typeof imported === 'object' && !Array.isArray(imported)
                    && Object.keys(imported).length > 0
                    && Object.values(imported).every(v => Array.isArray(v));
                if (!valid) { alert("รูปแบบไฟล์ JSON ไม่ถูกต้อง"); return; }
                if (!confirm("การนำเข้าจะแทนที่ Watchlists ปัจจุบันทั้งหมด ต้องการดำเนินการต่อหรือไม่?")) return;
                watchlists = imported;
                currentWL = Object.keys(watchlists)[0];
                saveWatchlists();
                refreshAll();
                alert("นำเข้า Watchlists สำเร็จ!");
            } catch (err) {
                alert("ไม่สามารถอ่านไฟล์ JSON ได้");
            }
        };
        reader.readAsText(file);
        event.target.value = '';   // ให้เลือกไฟล์เดิมซ้ำได้
    }

    loadData();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Watchlist Tablet Screener</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen overflow-hidden">

    <!-- Sidebar สำหรับเลือก Watchlist (รองรับสร้างไม่จำกัด และ Export/Import) -->
    <aside class="w-72 bg-slate-900 border-r border-slate-800 flex flex-col justify-between shrink-0">
        <div class="p-4 border-b border-slate-800">
            <h1 class="text-xl font-bold text-emerald-400 mb-1">Tablet Screener</h1>
            <p class="text-xs text-slate-400" id="last-update">กำลังโหลดข้อมูล...</p>
        </div>

        <!-- รายการ Watchlists (มี Scrollbar กรณีมีเยอะ) -->
        <div class="flex-1 overflow-y-auto p-4 space-y-2" id="watchlist-nav"></div>

        <!-- สร้าง Watchlist ใหม่ และ Export/Import -->
        <div class="p-4 border-t border-slate-800 space-y-2 bg-slate-900">
            <div class="flex gap-2">
                <input type="text" id="new-wl-name" placeholder="ชื่อ Watchlist ใหม่..." class="flex-1 bg-slate-800 text-sm px-3 py-2 rounded border border-slate-700 focus:outline-none focus:border-emerald-500">
                <button onclick="createWatchlist()" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-2 rounded text-sm font-medium transition cursor-pointer text-white font-bold">+</button>
            </div>
            <div class="flex gap-2 pt-1">
                <button onclick="exportWatchlists()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-xs py-2 rounded border border-slate-700 transition cursor-pointer text-center">Export JSON</button>
                <label class="flex-1 bg-slate-800 hover:bg-slate-700 text-xs py-2 rounded border border-slate-700 text-center transition cursor-pointer text-slate-200">
                    Import JSON <input type="file" id="import-file" class="hidden" accept=".json" onchange="importWatchlists(event)">
                </label>
            </div>
        </div>
    </aside>

    <!-- พื้นที่หลัก (Main Content) -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <!-- Header -->
        <header class="bg-slate-900 border-b border-slate-800 p-4 flex flex-wrap justify-between items-center gap-4 shrink-0">
            <div class="flex items-center gap-3">
                <h2 id="current-wl-title" class="text-xl font-semibold text-emerald-400">เลือก Watchlist</h2>
                <button onclick="renameCurrentWatchlist()" class="text-xs text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded border border-slate-700 transition">เปลี่ยนชื่อ</button>
                <button onclick="deleteCurrentWatchlist()" class="text-xs text-rose-400 hover:text-rose-300 bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded border border-slate-700 transition">ลบ</button>
            </div>

            <!-- ช่องค้นหาเพื่อเพิ่มหุ้น -->
            <div class="relative w-80">
                <input type="text" id="search-stock-input" placeholder="พิมพ์ชื่อหรือรหัสหุ้นเพื่อเพิ่ม..." oninput="searchUniverse()" class="w-full bg-slate-800 text-sm px-3 py-2 rounded border border-slate-700 focus:outline-none focus:border-emerald-500">
                <div id="search-results-dropdown" class="absolute left-0 right-0 mt-1 bg-slate-800 border border-slate-700 rounded shadow-lg max-h-60 overflow-y-auto z-50 hidden"></div>
            </div>
        </header>

        <!-- ผลลัพธ์หุ้นใน Watchlist (Fixed Header ตรึงนิ่งไม่เลื่อนตาม) -->
        <div class="flex-1 overflow-y-auto p-4">
            <div class="bg-slate-900 rounded-lg border border-slate-800 shadow-xl">
                <table class="w-full text-left border-collapse relative">
                    <thead class="sticky top-0 bg-slate-900 z-30 text-slate-200 text-xs shadow-md border-b border-slate-700">
                        <tr>
                            <th class="p-3 bg-slate-900">
                                <div class="flex items-center gap-1">
                                    <span>TICKER / NAME</span>
                                    <div class="flex gap-1 ml-1">
                                        <button onclick="sortStocks('ticker', 'asc')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-1.5 py-0.5 rounded text-[10px] font-bold cursor-pointer" title="A-Z">A↓</button>
                                        <button onclick="sortStocks('ticker', 'desc')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-1.5 py-0.5 rounded text-[10px] font-bold cursor-pointer" title="Z-A">Z↑</button>
                                    </div>
                                </div>
                            </th>
                            <th class="p-3 text-right bg-slate-900">
                                <div class="flex items-center justify-end gap-1">
                                    <span>PRICE</span>
                                    <button onclick="sortStocks('price', 'desc')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-1.5 py-0.5 rounded text-[10px] font-bold cursor-pointer">↓</button>
                                </div>
                            </th>
                            <th class="p-3 text-right bg-slate-900">
                                <div class="flex items-center justify-end gap-1">
                                    <span>MARKET CAP</span>
                                    <button onclick="sortStocks('marketCap', 'desc')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-1.5 py-0.5 rounded text-[10px] font-bold cursor-pointer">↓</button>
                                </div>
                            </th>
                            <th class="p-3 text-right bg-slate-900">
                                <div class="flex items-center justify-end gap-1">
                                    <span>P/E</span>
                                    <button onclick="sortStocks('pe', 'asc')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-1.5 py-0.5 rounded text-[10px] font-bold cursor-pointer">↑</button>
                                </div>
                            </th>
                            <th class="p-3 text-right bg-slate-900">
                                <div class="flex items-center justify-end gap-1">
                                    <span>P/BV</span>
                                    <button onclick="sortStocks('pb', 'asc')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-1.5 py-0.5 rounded text-[10px] font-bold cursor-pointer">↑</button>
                                </div>
                            </th>
                            <th class="p-3 text-right bg-slate-900">
                                <div class="flex items-center justify-end gap-1">
                                    <span>DIV YIELD (%)</span>
                                    <button onclick="sortStocks('dividendYield', 'desc')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-1.5 py-0.5 rounded text-[10px] font-bold cursor-pointer">↓</button>
                                </div>
                            </th>
                            <th class="p-3 text-right bg-slate-900">
                                <div class="flex items-center justify-end gap-1">
                                    <span>ROE (%)</span>
                                    <button onclick="sortStocks('roe', 'desc')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-1.5 py-0.5 rounded text-[10px] font-bold cursor-pointer">↓</button>
                                </div>
                            </th>
                            <th class="p-3 text-right bg-slate-900">
                                <div class="flex items-center justify-end gap-1">
                                    <span>D/E</span>
                                    <button onclick="sortStocks('de', 'asc')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-1.5 py-0.5 rounded text-[10px] font-bold cursor-pointer">↑</button>
                                </div>
                            </th>
                            <th class="p-3 text-right bg-slate-900">
                                <div class="flex items-center justify-end gap-1">
                                    <span>GPM (%)</span>
                                    <button onclick="sortStocks('gpm', 'desc')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-1.5 py-0.5 rounded text-[10px] font-bold cursor-pointer">↓</button>
                                </div>
                            </th>
                            <th class="p-3 text-right bg-slate-900">
                                <div class="flex items-center justify-end gap-1">
                                    <span>NPM (%)</span>
                                    <button onclick="sortStocks('npm', 'desc')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-1.5 py-0.5 rounded text-[10px] font-bold cursor-pointer">↓</button>
                                </div>
                            </th>
                            <th class="p-3 text-center bg-slate-900">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="stock-table-body" class="divide-y divide-slate-800 text-sm"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let globalData = { updated_at: "", stocks: [] };
        
        // โหลดข้อมูล Watchlists จาก localStorage (รองรับหลาย Watchlist ไม่จำกัด)
        let watchlists = JSON.parse(localStorage.getItem('tablet_watchlists'));
        if (!watchlists || typeof watchlists !== 'object' || Object.keys(watchlists).length === 0) {
            watchlists = { "Watchlist 1": [], "Watchlist 2": [] };
        }
        
        let currentWL = Object.keys(watchlists)[0];
        let currentSort = { key: null, order: 'asc' };

        async function loadData() {
            try {
                const res = await fetch('stocks_data.json');
                globalData = await res.json();
                document.getElementById('last-update').innerText = `อัปเดตล่าสุด: ${globalData.updated_at}`;
                renderWatchlistNav();
                renderTable();
            } catch (err) {
                console.error("ไม่สามารถโหลดข้อมูลหุ้นได้:", err);
                document.getElementById('last-update').innerText = "โหลดข้อมูลไม่สำเร็จ";
            }
        }

        function renderWatchlistNav() {
            const nav = document.getElementById('watchlist-nav');
            nav.innerHTML = '';
            Object.keys(watchlists).forEach(name => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-3 py-2.5 rounded text-sm font-medium transition cursor-pointer flex justify-between items-center ${name === currentWL ? 'bg-emerald-600 text-white font-bold' : 'text-slate-300 hover:bg-slate-800'}`;
                btn.innerHTML = `<span>${name}</span> <span class="text-xs opacity-75">(${(watchlists[name] || []).length})</span>`;
                btn.onclick = () => { currentWL = name; renderWatchlistNav(); renderTable(); };
                nav.appendChild(btn);
            });
            document.getElementById('current-wl-title').innerText = currentWL;
        }

        function createWatchlist() {
            const input = document.getElementById('new-wl-name');
            const name = input.value.trim();
            if (!name) return;
            if (watchlists[name]) {
                alert("มีชื่อ Watchlist นี้อยู่แล้ว");
                return;
            }
            watchlists[name] = [];
            saveAndRefresh();
            input.value = '';
            currentWL = name;
            renderWatchlistNav();
            renderTable();
        }

        function renameCurrentWatchlist() {
            const newName = prompt("เปลี่ยนชื่อ Watchlist เป็น:", currentWL);
            if (!newName || !newName.trim()) return;
            const trimmed = newName.trim();
            if (trimmed === currentWL) return;
            if (watchlists[trimmed]) {
                alert("มีชื่อ Watchlist นี้อยู่แล้ว");
                return;
            }
            watchlists[trimmed] = watchlists[currentWL];
            delete watchlists[currentWL];
            currentWL = trimmed;
            saveAndRefresh();
            renderWatchlistNav();
            renderTable();
        }

        function deleteCurrentWatchlist() {
            if (Object.keys(watchlists).length <= 1) {
                alert("ต้องมี Watchlist อย่างน้อย 1 รายการ");
                return;
            }
            if (confirm(`คุณต้องการลบ ${currentWL} ใช่หรือไม่?`)) {
                delete watchlists[currentWL];
                currentWL = Object.keys(watchlists)[0];
                saveAndRefresh();
                renderWatchlistNav();
                renderTable();
            }
        }

        function searchUniverse() {
            const keyword = document.getElementById('search-stock-input').value.toLowerCase();
            const dropdown = document.getElementById('search-results-dropdown');
            if (!keyword) { dropdown.classList.add('hidden'); return; }

            const matched = globalData.stocks.filter(s => s.ticker.toLowerCase().includes(keyword) || s.name.toLowerCase().includes(keyword));
            if (matched.length === 0) { dropdown.classList.add('hidden'); return; }

            dropdown.innerHTML = matched.map(s => `
                <div onclick="addStockToCurrentWL('${s.ticker}')" class="p-2 hover:bg-slate-700 cursor-pointer text-xs flex justify-between border-b border-slate-700">
                    <span class="font-bold text-emerald-400">${s.ticker}</span>
                    <span class="text-slate-300 truncate max-w-[180px]">${s.name}</span>
                </div>
            `).join('');
            dropdown.classList.remove('hidden');
        }

        function addStockToCurrentWL(ticker) {
            if (!watchlists[currentWL]) watchlists[currentWL] = [];
            if (!watchlists[currentWL].includes(ticker)) {
                watchlists[currentWL].push(ticker);
                saveAndRefresh();
                renderWatchlistNav();
                renderTable();
            }
            document.getElementById('search-stock-input').value = '';
            document.getElementById('search-results-dropdown').classList.add('hidden');
        }

        function removeStock(ticker) {
            watchlists[currentWL] = watchlists[currentWL].filter(t => t !== ticker);
            saveAndRefresh();
            renderWatchlistNav();
            renderTable();
        }

        function sortStocks(key, order) {
            currentSort = { key, order };
            renderTable();
        }

        function formatMarketCap(marketCap) {
            if (!marketCap) return '-';
            if (marketCap >= 1e12) return (marketCap / 1e12).toFixed(2) + 'T';
            if (marketCap >= 1e9) return (marketCap / 1e9).toFixed(2) + 'B';
            if (marketCap >= 1e6) return (marketCap / 1e6).toFixed(2) + 'M';
            return marketCap.toLocaleString();
        }

        function renderTable() {
            const tbody = document.getElementById('stock-table-body');
            const tickers = watchlists[currentWL] || [];
            let stocksInWL = globalData.stocks.filter(s => tickers.includes(s.ticker));

            if (currentSort.key) {
                stocksInWL.sort((a, b) => {
                    let valA = a[currentSort.key];
                    let valB = b[currentSort.key];
                    if (valA === undefined || valA === null) valA = 0;
                    if (valB === undefined || valB === null) valB = 0;
                    
                    if (typeof valA === 'string') {
                        return currentSort.order === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                    }
                    return currentSort.order === 'asc' ? valA - valB : valB - valA;
                });
            }

            if (stocksInWL.length === 0) {
                tbody.innerHTML = `<tr><td colspan="11" class="p-8 text-center text-slate-500">ยังไม่มีหุ้นใน Watchlist นี้ (ใช้ช่องค้นหาด้านบนเพื่อเพิ่มหุ้น)</td></tr>`;
                return;
            }

            tbody.innerHTML = stocksInWL.map(s => `
                <tr class="hover:bg-slate-800/50 transition">
                    <td class="p-3">
                        <div class="font-bold text-emerald-400">${s.ticker}</div>
                        <div class="text-xs text-slate-400 truncate max-w-[150px]">${s.name}</div>
                    </td>
                    <td class="p-3 text-right font-mono">${s.price ? s.price.toLocaleString() : '-'}</td>
                    <td class="p-3 text-right font-mono">${formatMarketCap(s.marketCap)}</td>
                    <td class="p-3 text-right font-mono">${s.pe ? s.pe.toFixed(2) : '-'}</td>
                    <td class="p-3 text-right font-mono">${s.pb ? s.pb.toFixed(2) : '-'}</td>
                    <td class="p-3 text-right font-mono">${s.dividendYield ? s.dividendYield.toFixed(2) + '%' : '-'}</td>
                    <td class="p-3 text-right font-mono">${s.roe ? s.roe.toFixed(2) + '%' : '-'}</td>
                    <td class="p-3 text-right font-mono">${s.de ? s.de.toFixed(2) : '-'}</td>
                    <td class="p-3 text-right font-mono">${s.gpm ? s.gpm.toFixed(2) + '%' : '-'}</td>
                    <td class="p-3 text-right font-mono">${s.npm ? s.npm.toFixed(2) + '%' : '-'}</td>
                    <td class="p-3 text-center">
                        <button onclick="removeStock('${s.ticker}')" class="text-rose-400 hover:text-rose-300 text-xs bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded border border-slate-700 transition cursor-pointer">ลบ</button>
                    </td>
                </tr>
            `).join('');
        }

        function saveAndRefresh() {
            localStorage.setItem('tablet_watchlists', JSON.stringify(watchlists));
        }

        function exportWatchlists() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(watchlists, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "my_tablet_watchlists.json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function importWatchlists(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (typeof imported === 'object' && imported !== null && !Array.isArray(imported)) {
                        watchlists = imported;
                        currentWL = Object.keys(watchlists)[0] || "Watchlist 1";
                        saveAndRefresh();
                        renderWatchlistNav();
                        renderTable();
                        alert("นำเข้า Watchlists สำเร็จ!");
                    } else {
                        alert("รูปแบบไฟล์ JSON ไม่ถูกต้อง");
                    }
                } catch (err) {
                    alert("ไม่สามารถอ่านไฟล์ JSON ได้");
                }
            };
            reader.readAsText(file);
        }

        loadData();
    </script>
</body>
</html>
